name: Muhely cron ellenorzo

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repó életben tartása (60 napos inaktivitás elkerülése)
        uses: gautamkrishnar/keepalive-workflow@v2

      - name: Node.js telepítése
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Playwright telepítése (fej nélküli Chrome)
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Oldal meglátogatása valódi böngészőként
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://velocemuhely.rf.gd/cron_ellenorzo.php', { waitUntil: 'networkidle', timeout: 30000 });
            const szoveg = await page.evaluate(() => document.body.innerText);
            console.log('Válasz:', szoveg);
            await browser.close();
          })();
          "
